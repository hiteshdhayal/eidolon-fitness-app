# Eidolon — eidolon.cloud
#
# Static dist/ served from an atomically-swapped "current" symlink, plus a
# reverse proxy to the self-hosted Umami container on stats.eidolon.cloud.
#
# Install: copy this file to /etc/nginx/sites-available/eidolon.cloud,
# symlink it into sites-enabled, then run certbot (see docs/DEPLOY.md) —
# certbot rewrites the server_name 443 blocks below in place to add its
# ssl_certificate directives and the HTTP->HTTPS redirect.

# Rate limit zone for the og/* image endpoint — build-time generated, static
# files, but still worth a floor against scraping.
limit_req_zone $binary_remote_addr zone=eidolon_general:10m rate=30r/s;

# www -> apex, before TLS is in place certbot will add the 443 server block.
server {
    listen 80;
    listen [::]:80;
    server_name www.eidolon.cloud;
    return 301 https://eidolon.cloud$request_uri;
}

# HTTP -> HTTPS (certbot --nginx edits this block to add TLS + redirect; left
# here as the plain starting point it expects).
server {
    listen 80;
    listen [::]:80;
    server_name eidolon.cloud;

    location / {
        return 301 https://eidolon.cloud$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.eidolon.cloud;

    location / {
        return 301 https://stats.eidolon.cloud$request_uri;
    }
}

server {
    # certbot adds `listen 443 ssl;` + certificate directives here.
    server_name eidolon.cloud;

    root /var/www/eidolon.cloud/current;
    index index.html;

    # --- Security headers -------------------------------------------------
    # Instagram embeds (script + frame) only load on reel and article pages,
    # so those two locations get a looser CSP below; everywhere else gets the
    # strict default. stats.eidolon.cloud is allowed everywhere once Umami is
    # live (src/config/site.ts's umamiWebsiteId stays empty until then, so no
    # request to it happens before this is actually needed).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    set $csp_default "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https://stats.eidolon.cloud; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://stats.eidolon.cloud; connect-src 'self' https://stats.eidolon.cloud; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp_default always;

    limit_req zone=eidolon_general burst=60 nodelay;

    # Instagram embed CSP for pages that can render a ReelEmbed (reels and
    # articles reference reels). Keep in sync with src/components/content/ReelEmbed.astro.
    location ~ ^/(reels|articles)/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https://stats.eidolon.cloud https://*.cdninstagram.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://stats.eidolon.cloud https://www.instagram.com; frame-src https://www.instagram.com; connect-src 'self' https://stats.eidolon.cloud; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

        try_files $uri $uri/ $uri.html =404;
    }

    # Astro's hashed, immutable build assets — cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is prerendered HTML — never cache it, so a new release
    # (same URL, new hashed asset references) shows up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 512;

    # brotli_* directives need the ngx_brotli module (not in stock Ubuntu
    # nginx); uncomment once it's installed (see docs/DEPLOY.md).
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
}

server {
    # certbot adds `listen 443 ssl;` + certificate directives here.
    server_name stats.eidolon.cloud;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
