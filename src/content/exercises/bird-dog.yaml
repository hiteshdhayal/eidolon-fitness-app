summary: "On all fours, reaching opposite arm and leg while keeping a steady back."
steps: ["Start on your hands and knees, hands under shoulders.", "Reach one arm forward and the opposite leg back.", "Keep your hips level and your back flat.", "Return and repeat on the other side."]
