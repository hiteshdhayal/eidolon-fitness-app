summary: "The barbell version of the hip hinge, for heavier hamstring work."
steps: ["Hold the bar at your hips, hands shoulder-width apart.", "Soften your knees and push your hips back, letting the bar slide down your thighs.", "Stop at the stretch, keeping the bar close.", "Drive the hips forward to stand tall."]
