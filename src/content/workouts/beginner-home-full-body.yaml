title: "Beginner home full-body"
summary: "Three simple full-body days at home, with no equipment."
level: "beginner"
daysPerWeek: 3
where: "home"
days:
  - name: "Day 1 — Full body A"
    exercises:
      - exercise: "box-squat"
        sets: "3"
        reps: "10–12"
        rest: "60 s"
      - exercise: "incline-push-up"
        sets: "3"
        reps: "6–10"
        rest: "60 s"
      - exercise: "glute-bridge"
        sets: "3"
        reps: "12–15"
        rest: "45 s"
      - exercise: "bird-dog"
        sets: "2"
        reps: "8 each side"
        rest: "45 s"
  - name: "Day 2 — Full body B"
    exercises:
      - exercise: "reverse-lunge"
        sets: "3"
        reps: "8 each side"
        rest: "60 s"
      - exercise: "wall-push-up"
        sets: "3"
        reps: "10–15"
        rest: "45 s"
      - exercise: "hip-hinge-drill"
        sets: "3"
        reps: "10"
        rest: "45 s"
      - exercise: "forearm-plank"
        sets: "3"
        reps: "20–40 s"
        rest: "45 s"
  - name: "Day 3 — Full body C"
    exercises:
      - exercise: "step-up"
        sets: "3"
        reps: "8 each side"
        rest: "60 s"
      - exercise: "knee-push-up"
        sets: "3"
        reps: "6–10"
        rest: "60 s"
      - exercise: "wall-sit"
        sets: "3"
        reps: "20–40 s"
        rest: "45 s"
      - exercise: "dead-bug"
        sets: "2"
        reps: "8 each side"
        rest: "45 s"
progression: "Add a rep each week. When you reach the top of the rep range, add weight and start again at the bottom."
draft: true
