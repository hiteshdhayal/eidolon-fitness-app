title: "Upper/lower split"
summary: "Four gym days split into two upper and two lower sessions."
level: "intermediate"
daysPerWeek: 4
where: "gym"
days:
  - name: "Day 1 — Upper A"
    exercises:
      - exercise: "dumbbell-bench-press"
        sets: "4"
        reps: "6–10"
        rest: "120 s"
      - exercise: "one-arm-dumbbell-row"
        sets: "4"
        reps: "8–10 each side"
        rest: "90 s"
      - exercise: "dumbbell-shoulder-press"
        sets: "3"
        reps: "8–10"
        rest: "90 s"
      - exercise: "lat-pulldown"
        sets: "3"
        reps: "10–12"
        rest: "75 s"
  - name: "Day 2 — Lower A"
    exercises:
      - exercise: "barbell-back-squat"
        sets: "4"
        reps: "5–8"
        rest: "150 s"
      - exercise: "barbell-romanian-deadlift"
        sets: "3"
        reps: "8–10"
        rest: "120 s"
      - exercise: "split-squat"
        sets: "3"
        reps: "8 each side"
        rest: "90 s"
      - exercise: "side-plank"
        sets: "3"
        reps: "20–30 s each side"
        rest: "45 s"
  - name: "Day 3 — Upper B"
    exercises:
      - exercise: "overhead-press"
        sets: "4"
        reps: "5–8"
        rest: "120 s"
      - exercise: "seated-cable-row"
        sets: "4"
        reps: "8–12"
        rest: "90 s"
      - exercise: "dumbbell-bench-press"
        sets: "3"
        reps: "10–12"
        rest: "90 s"
      - exercise: "inverted-row"
        sets: "3"
        reps: "8–12"
        rest: "75 s"
  - name: "Day 4 — Lower B"
    exercises:
      - exercise: "deadlift"
        sets: "3"
        reps: "3–5"
        rest: "180 s"
      - exercise: "goblet-squat"
        sets: "3"
        reps: "10–12"
        rest: "90 s"
      - exercise: "walking-lunge"
        sets: "3"
        reps: "10 each side"
        rest: "90 s"
      - exercise: "hip-thrust"
        sets: "3"
        reps: "10–12"
        rest: "90 s"
progression: "Add a rep each week. When you reach the top of the rep range, add weight and start again at the bottom."
draft: true
