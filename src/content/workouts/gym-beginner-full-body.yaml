title: "Gym beginner full-body"
summary: "Three full-body gym days with simple dumbbell and machine work."
level: "beginner"
daysPerWeek: 3
where: "gym"
days:
  - name: "Day 1 — Full body A"
    exercises:
      - exercise: "goblet-squat"
        sets: "3"
        reps: "8–12"
        rest: "90 s"
      - exercise: "dumbbell-bench-press"
        sets: "3"
        reps: "8–12"
        rest: "90 s"
      - exercise: "seated-cable-row"
        sets: "3"
        reps: "10–12"
        rest: "75 s"
      - exercise: "forearm-plank"
        sets: "2"
        reps: "30–45 s"
        rest: "45 s"
  - name: "Day 2 — Full body B"
    exercises:
      - exercise: "dumbbell-romanian-deadlift"
        sets: "3"
        reps: "8–12"
        rest: "90 s"
      - exercise: "dumbbell-shoulder-press"
        sets: "3"
        reps: "8–12"
        rest: "75 s"
      - exercise: "lat-pulldown"
        sets: "3"
        reps: "10–12"
        rest: "75 s"
      - exercise: "dead-bug"
        sets: "2"
        reps: "8 each side"
        rest: "45 s"
  - name: "Day 3 — Full body C"
    exercises:
      - exercise: "split-squat"
        sets: "3"
        reps: "8 each side"
        rest: "75 s"
      - exercise: "one-arm-dumbbell-row"
        sets: "3"
        reps: "10 each side"
        rest: "75 s"
      - exercise: "dumbbell-bench-press"
        sets: "3"
        reps: "10–12"
        rest: "75 s"
      - exercise: "glute-bridge"
        sets: "3"
        reps: "12–15"
        rest: "45 s"
progression: "Add a rep each week. When you reach the top of the rep range, add weight and start again at the bottom."
draft: true
